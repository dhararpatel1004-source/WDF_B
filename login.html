<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: lavender;
        }

        .header {
            background-color: bisque;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            color: #4b2e83;
        }

        .login-box {
            width: 350px;
            background-color: white;
            margin: 60px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 3px 10px gray;
            text-align: center;
        }

        .login-box h2 {
            color: #4b2e83;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        .login-button {
            background-color: #4b2e83;
            color: white;
            border: none;
            padding: 12px 30px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-button:hover {
            background-color: #7655ad;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #4b2e83;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>Charusat Student Portal</h1>

    </div>


    <div class="login-box">

        <h2>Student Login</h2>

        <form action="dashboard.html">

            <input type="text"
                   placeholder="Enter Student ID"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <br>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>


        <a href="home.html" class="back">
            ← Back to Home
        </a>

    </div>


</body>

</html>
