<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Event Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef6ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #2874a6;
        }

        h2 {
            color: #111;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background: #2874a6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 20px;
            margin-right: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1f5d86;
        }

        .message {
            margin-top: 20px;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #2874a6;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .edit {
            background: #f39c12;
        }

        .delete {
            background: #e74c3c;
        }

        .edit:hover {
            background: #d68910;
        }

        .delete:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>StudentHub Event Management</h1>

    <h2>Add / Update Event</h2>

    <input type="hidden" id="event_id">

    <label>Event Name:</label>
    <input type="text" id="event_name" placeholder="Enter event name">

    <label>Event Date:</label>
    <input type="date" id="event_date">

    <label>Venue:</label>
    <input type="text" id="venue" placeholder="Enter venue">

    <button onclick="saveEvent()">Save Event</button>
    <button onclick="clearForm()">Clear</button>

    <div id="message" class="message"></div>

    <h2>All Events</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="eventTable">
        </tbody>
    </table>

</div>

<script>

const API_URL = "http://localhost/StudentHub/api_event.php";


function loadEvents() {

    fetch(API_URL)
        .then(response => {

            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            return response.json();
        })

        .then(result => {

            if (!result.success) {
                throw new Error(result.message || "API error");
            }

            const table = document.getElementById("eventTable");

            table.innerHTML = "";

            if (result.data.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="5">No events found</td>
                    </tr>
                `;

                return;
            }

            result.data.forEach(event => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${event.event_id}</td>
                    <td>${event.event_name}</td>
                    <td>${event.event_date}</td>
                    <td>${event.venue}</td>

                    <td>
                        <button class="edit"
                            onclick='editEvent(${JSON.stringify(event)})'>
                            Edit
                        </button>

                        <button class="delete"
                            onclick="deleteEvent(${event.event_id})">
                            Delete
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });

        })

        .catch(error => {

            console.error("API Error:", error);

            showMessage(
                "Unable to connect to API: " + error.message,
                "error"
            );
        });
}


function saveEvent() {

    const id = document.getElementById("event_id").value;
    const name = document.getElementById("event_name").value.trim();
    const date = document.getElementById("event_date").value;
    const venue = document.getElementById("venue").value.trim();

    if (name === "" || date === "" || venue === "") {

        showMessage(
            "Please fill all fields.",
            "error"
        );

        return;
    }

    const data = {
        event_name: name,
        event_date: date,
        venue: venue
    };

    let method = "POST";

    if (id !== "") {

        data.event_id = id;
        method = "PUT";
    }

    fetch(API_URL, {

        method: method,

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("HTTP error " + response.status);
        }

        return response.json();
    })

    .then(result => {

        if (!result.success) {
            throw new Error(result.message || "Unable to save event");
        }

        showMessage(
            id === ""
                ? "Event added successfully!"
                : "Event updated successfully!",
            "success"
        );

        clearForm();

        loadEvents();

    })

    .catch(error => {

        console.error("Save Error:", error);

        showMessage(
            "Error while saving event: " + error.message,
            "error"
        );
    });
}



function editEvent(event) {

    document.getElementById("event_id").value =
        event.event_id;

    document.getElementById("event_name").value =
        event.event_name;

    document.getElementById("event_date").value =
        event.event_date;

    document.getElementById("venue").value =
        event.venue;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}



function deleteEvent(id) {

    if (!confirm("Are you sure you want to delete this event?")) {
        return;
    }

    fetch(API_URL, {

        method: "DELETE",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            event_id: id
        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("HTTP error " + response.status);
        }

        return response.json();
    })

    .then(result => {

        if (!result.success) {
            throw new Error(result.message || "Unable to delete event");
        }

        showMessage(
            "Event deleted successfully!",
            "success"
        );

        loadEvents();

    })

    .catch(error => {

        console.error("Delete Error:", error);

        showMessage(
            "Error while deleting event: " + error.message,
            "error"
        );
    });
}



function clearForm() {

    document.getElementById("event_id").value = "";

    document.getElementById("event_name").value = "";

    document.getElementById("event_date").value = "";

    document.getElementById("venue").value = "";
}



function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;
}


loadEvents();

</script>

</body>
</html>
