<!DOCTYPE html>
<html>

<head>

    <title>Logout - Student Portal</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: lavender;
            color: #333;
        }

        .header {
            background-color: bisque;
            padding: 25px;
            text-align: center;
            box-shadow: 0px 3px 8px gray;
        }

        .header h1 {
            color: #4b2e83;
            margin: 5px;
        }

        .logout-box {
            width: 400px;
            background-color: white;
            margin: 80px auto;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0px 3px 10px gray;
        }

        .logout-box h2 {
            color: #4b2e83;
        }

        .logout-box p {
            font-size: 17px;
        }

        .home-button {
            display: inline-block;
            background-color: #4b2e83;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            margin-top: 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .home-button:hover {
            background-color: #7655ad;
        }

        .footer {
            background-color: #4b2e83;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 100px;
        }

    </style>

</head>


<body>

    <div class="header">

        <h1>Charusat Student Portal</h1>

        <h2>Logout</h2>

    </div>

    <div class="logout-box">

        <h2>Logout Successful!</h2>

        <p>
            You have been successfully logged out
            of the Student Portal.
        </p>

        <p>
            Thank you for using Charusat Student Portal.
        </p>

        <a href="home.html" class="home-button">
            Go to Home Page
        </a>

    </div>

    <div class="footer">

        <p>
            © 2026 Charusat Student Portal | All Rights Reserved
        </p>

    </div>


</body>

</html>
